# Render blueprint. The Dockerfile already reads $PORT, which is what Render
# sets, so no changes are needed to run the same image here.
services:
  - type: web
    name: moodflick
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render pings this; it is cheap and does not touch the camera.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Unbuffered so startup and request logs appear live in the dashboard.
      - key: PYTHONUNBUFFERED
        value: "1"
      # sync: false means Render prompts for this in the dashboard and it never
      # enters the repository. Without it the app falls back to its built-in
      # catalogue, which still works.
      - key: TMDB_API_KEY
        sync: false
      # Country used for streaming availability.
      - key: TMDB_REGION
        value: PK
